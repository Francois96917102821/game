name: Publish web game

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.repository_id }}
  cancel-in-progress: true

jobs:
  publish:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out game
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static game files
        run: |
          mkdir -p dist
          cp index.html styles.css game.js game-art.svg cloud-save.js player-groups.js cloud-config.js tavern-model.js gold-economy-model.js expeditions-model.js homestead-model.js soul-crafting-model.js rune-model.js dungeon-model.js pvp-client.js class-model.js city-model.js dist/
      - name: Configure optional Supabase client
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            export SUPABASE_URL SUPABASE_ANON_KEY
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          config = {
              "supabaseUrl": os.environ["SUPABASE_URL"],
              "supabaseAnonKey": os.environ["SUPABASE_ANON_KEY"],
          }
          Path("dist/cloud-config.js").write_text(
              "window.WELL_CLOUD_CONFIG = "
              + json.dumps(config, ensure_ascii=True)
              + ";\n",
              encoding="utf-8",
          )
          PY
          elif [ -n "$SUPABASE_URL" ] || [ -n "$SUPABASE_ANON_KEY" ]; then
            echo "Set both SUPABASE_URL and SUPABASE_ANON_KEY, or neither."
            exit 1
          fi
      - name: Refresh cached assets for this release
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          sed -i "s|href=\"styles.css\"|href=\"styles.css?v=${DEPLOY_SHA}\"|; s|src=\"cloud-config.js\"|src=\"cloud-config.js?v=${DEPLOY_SHA}\"|; s|src=\"cloud-save.js\"|src=\"cloud-save.js?v=${DEPLOY_SHA}\"|; s|src=\"player-groups.js\"|src=\"player-groups.js?v=${DEPLOY_SHA}\"|; s|src=\"tavern-model.js\"|src=\"tavern-model.js?v=${DEPLOY_SHA}\"|; s|src=\"gold-economy-model.js\"|src=\"gold-economy-model.js?v=${DEPLOY_SHA}\"|; s|src=\"expeditions-model.js\"|src=\"expeditions-model.js?v=${DEPLOY_SHA}\"|; s|src=\"homestead-model.js\"|src=\"homestead-model.js?v=${DEPLOY_SHA}\"|; s|src=\"soul-crafting-model.js\"|src=\"soul-crafting-model.js?v=${DEPLOY_SHA}\"|; s|src=\"rune-model.js\"|src=\"rune-model.js?v=${DEPLOY_SHA}\"|; s|src=\"dungeon-model.js\"|src=\"dungeon-model.js?v=${DEPLOY_SHA}\"|; s|src=\"pvp-client.js\"|src=\"pvp-client.js?v=${DEPLOY_SHA}\"|; s|src=\"game.js\"|src=\"game.js?v=${DEPLOY_SHA}\"|" dist/index.html
          sed -i "s|const GAME_ART_URL = \"game-art.svg\";|const GAME_ART_URL = \"game-art.svg?v=${DEPLOY_SHA}\";|" dist/game.js
          sed -i "s|src=\"gold-economy-model.js\"|src=\"gold-economy-model.js?v=${DEPLOY_SHA}\"|" dist/index.html
          sed -i "s|src=\"class-model.js\"|src=\"class-model.js?v=${DEPLOY_SHA}\"|" dist/index.html
          sed -i "s|src=\"city-model.js\"|src=\"city-model.js?v=${DEPLOY_SHA}\"|" dist/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
