name: Test dungeon combat and Monty Hall

on:
  pull_request:
    paths:
      - "dungeon-model.js"
      - "rune-model.js"
      - "soul-crafting-model.js"
      - "elemental-gear-model.js"
      - "gold-economy-model.js"
      - "tavern-model.js"
      - "game.js"
      - "pvp-client.js"
      - "index.html"
      - "styles.css"
      - "tests/*.html"
      - "tests/run-browser-tests.mjs"
      - "tests/pages-artifact.test.mjs"
      - ".github/workflows/deploy-pages.yml"
      - ".github/workflows/test-dungeon.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - name: Check out game
        uses: actions/checkout@v4
      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1
      - name: Set up browser test runtime
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run dungeon browser tests
        run: |
          set -euo pipefail
          mkdir -p .dungeon-ci
          python3 -m http.server 8765 --bind 127.0.0.1 > .dungeon-ci/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"; rm -rf .dungeon-ci' EXIT
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:8765/tests/dungeon.test.html > /dev/null; then
              break
            fi
            sleep 1
          done
          node tests/run-browser-tests.mjs
      - name: Check Pages artifact assets without deployment
        run: node tests/pages-artifact.test.mjs
