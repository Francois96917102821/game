name: Test harbor expeditions

on:
  pull_request:
    paths:
      - "expeditions-model.js"
      - "housing-model.js"
      - "game.js"
      - "index.html"
      - "styles.css"
      - "tests/expeditions.test.html"
      - "tests/housing.test.html"
      - ".github/workflows/test-expeditions.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - name: Check out game
        uses: actions/checkout@v4
      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1
      - name: Run browser model and city tests
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/game-test-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:8765/tests/expeditions.test.html > /dev/null; then
              break
            fi
            sleep 1
          done
          for test_page in expeditions housing; do
            chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --disable-extensions --dump-dom --virtual-time-budget=25000 \
              "http://127.0.0.1:8765/tests/${test_page}.test.html" > "/tmp/${test_page}-test.html"
            if ! grep -q 'data-result="pass"' "/tmp/${test_page}-test.html"; then
              cat "/tmp/${test_page}-test.html"
              exit 1
            fi
            grep -o 'PASS [^<]*' "/tmp/${test_page}-test.html"
          done
