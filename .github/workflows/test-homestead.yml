name: Test homestead, food and settings UI

on:
  pull_request:
    paths:
      - "homestead-model.js"
      - "heart-shard-model.js"
      - "tavern-model.js"
      - "cloud-save.js"
      - "game.js"
      - "player-groups.js"
      - "index.html"
      - "styles.css"
      - "tests/homestead.test.html"
      - "tests/heart-shards.test.html"
      - "tests/tavern.test.html"
      - "tests/food.test.html"
      - "tests/settings.test.html"
      - "tests/run-browser-tests.mjs"
      - ".github/workflows/test-homestead.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - name: Check out game
        uses: actions/checkout@v4
      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1
      - name: Set up browser test runtime
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run homestead, food and settings browser tests
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/game-homestead-test-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:8765/tests/homestead.test.html > /dev/null; then
              break
            fi
            sleep 1
          done
          node tests/run-browser-tests.mjs homestead tavern food settings heart-shards
