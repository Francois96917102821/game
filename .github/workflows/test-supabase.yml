name: Test Supabase schema

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/test-supabase.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: game_groups_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d game_groups_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out game
        uses: actions/checkout@v4
      - name: Ensure PostgreSQL client is available
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Bootstrap auth, apply schema twice, and test group RPCs
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: local-test-only
          PGDATABASE: game_groups_test
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/player_groups.sql
      - name: Test authoritative wallet RPCs
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: local-test-only
          PGDATABASE: game_groups_test
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/wallet.sql
      - name: Test authoritative PvP RPCs
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: local-test-only
          PGDATABASE: game_groups_test
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/pvp.sql
      - name: Test authoritative item issuance and custody
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: local-test-only
          PGDATABASE: game_groups_test
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/items.sql
      - name: Test server-authoritative guild expeditions
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: local-test-only
          PGDATABASE: game_groups_test
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/expeditions.sql
