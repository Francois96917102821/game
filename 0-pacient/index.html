<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d0c">
<title>Нулевой пациент</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="particles"></canvas>
<div id="bg" class="bg"></div>
<div class="noise"></div>
<div class="vignette"></div>
<div id="flash" class="flash"></div>

<section id="intro" class="screen active">
  <h1 class="glitch" data-text="НУЛЕВОЙ ПАЦИЕНТ">НУЛЕВОЙ ПАЦИЕНТ</h1>
  <p class="subtitle">текстовая игра</p>
  <div class="menu">
    <button id="btn-continue" hidden>Продолжить</button>
    <button id="btn-new">Новая игра</button>
    <button id="btn-endings">Концовки</button>
  </div>
  <p class="hint">Лучше играть в наушниках</p>
</section>

<section id="endings" class="screen">
  <h2>Концовки</h2>
  <ul id="endings-list"></ul>
  <div class="menu"><button id="btn-back">Назад</button></div>
</section>

<section id="game" class="screen">
  <header class="topbar">
    <div id="stats"></div>
    <div class="tools">
      <button id="btn-mute" class="icon" aria-label="Звук">🔊</button>
      <button id="btn-menu" class="icon" aria-label="Меню">☰</button>
    </div>
  </header>
  <main id="story" class="story">
    <div id="text" class="text"></div>
    <div id="choices" class="choices"></div>
  </main>
</section>

<script src="js/story.js"></script>
<script src="js/audio.js"></script>
<script src="js/fx.js"></script>
<script src="js/engine.js"></script>
</body>
</html>
