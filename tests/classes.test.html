<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Class catalog and save compatibility</title>
<h1 id="result">RUNNING</h1>
<pre id="log"></pre>
<script src="../class-model.js"></script>
<script>
"use strict";
(async () => {
  const log = document.getElementById("log");
  const failures = [];
  function assert(condition, message) {
    if (!condition) throw new Error(message);
  }
  function equal(actual, expected, message) {
    assert(JSON.stringify(actual) === JSON.stringify(expected), message);
  }
  function check(name, work) {
    try { work(); log.textContent += `PASS ${name}\n`; }
    catch (error) { failures.push(`${name}: ${error.stack}`); }
  }
  const model = window.WellClassModel;
  check("catalog loads independently and keeps the complete class tree", () => {
    equal(model.BASE_CLASSES.map((item) => item.id), ["knight", "mystic", "shadow"], "base ordering changed");
    assert(model.ADVANCED_CLASSES.length === 6 && model.MASTERY_CLASSES.length === 12 &&
      model.CLASS_BY_ID.size === 21, "class count changed");
    equal(model.CLASS_UNLOCK_LEVELS, { advanced: 3, mastery: 9 }, "unlock levels changed");
    equal(model.LEGACY_SUBCLASS_LEVELS, [3, 6, 9], "legacy levels changed");
    for (const [index, classes] of [model.BASE_CLASSES, model.ADVANCED_CLASSES, model.MASTERY_CLASSES].entries()) {
      for (const item of classes) {
        const indexed = model.CLASS_BY_ID.get(item.id);
        equal(indexed, { ...item, tier: index + 1 }, `${item.id} index changed`);
        if (item.parent) {
          const parent = model.CLASS_BY_ID.get(item.parent);
          assert(parent.tier === index && parent.children.includes(item.id), `${item.id} parent mismatch`);
        }
        for (const childId of item.children || []) {
          assert(model.CLASS_BY_ID.get(childId).parent === item.id, `${childId} child mismatch`);
        }
        const base = index === 0 ? item.id : index === 1 ? item.parent : model.CLASS_BY_ID.get(item.parent).parent;
        assert(model.getBaseClassId(item.id) === base, `${item.id} resolves to wrong base`);
      }
    }
    for (const id of [undefined, null, "", "unknown", "warrior"]) {
      assert(model.getBaseClassId(id) === "knight", "existing lookup fallback changed");
    }
  });
  const legacyPaths = {
    warrior: ["knight", "paladin", "crusader"],
    ranger: ["shadow", "assassin", "royalassassin"],
    rogue: ["shadow", "assassin", "darkblade"],
    mage: ["mystic", "keeper", "archmage"],
    paladin: ["knight", "paladin", "lightbearer"],
    berserker: ["knight", "executioner", "berserker"],
  };
  check("legacy migration tables retain their exact values", () => {
    equal([...model.LEGACY_CLASS_MIGRATIONS], Object.entries(legacyPaths).map(([id, path]) =>
      [id, { base: path[0], advanced: path[1], mastery: path[2] }]), "legacy paths changed");
    equal([...model.LEGACY_SUBCLASS_IDS], [
      "guardian", "slayer", "champion", "sniper", "tracker", "survivor",
      "evoker", "frostmage", "mender", "assassin", "shadow", "cutpurse",
      "oathkeeper", "inquisitor", "luminary", "reaver", "ironhide", "blooddrinker",
    ], "legacy subclass IDs changed");
  });

  localStorage.clear();
  const frame = document.createElement("iframe");
  frame.title = "Game under test";
  frame.style.width = "390px";
  frame.src = "../index.html?classes-test=1";
  const loaded = new Promise((resolve) => frame.addEventListener("load", resolve, { once: true }));
  document.body.append(frame);
  await loaded;
  const app = frame.contentWindow;
  app.startGameWithClass("knight");
  const snapshot = app.getCloudSaveSnapshot();
  const clone = (value) => JSON.parse(JSON.stringify(value));
  check("game aliases share the extracted catalog and preserve the lookup API", () => {
    assert(app.eval("CLASS_BY_ID === window.WellClassModel.CLASS_BY_ID"), "index was duplicated");
    assert(app.eval("BASE_CLASSES === window.WellClassModel.BASE_CLASSES"), "base catalog was duplicated");
    for (const item of model.CLASS_BY_ID.values()) {
      assert(app.getBaseClassId(item.id) === model.getBaseClassId(item.id), "game lookup differs");
    }
  });
  check("all current class paths survive save validation and restore", () => {
    for (const mastery of model.MASTERY_CLASSES) {
      const next = clone(snapshot);
      const advanced = model.CLASS_BY_ID.get(mastery.parent);
      Object.assign(next.run.state, {
        level: 9, xp: 0, classId: advanced.parent,
        advancedClassId: advanced.id, masteryClassId: mastery.id, pendingClassLevels: [],
      });
      assert(app.isValidRun(next.run), `${mastery.id} save rejected`);
      app.restoreCloudSave(next);
      app.resumeGame();
      const restored = app.getCloudSaveSnapshot().run;
      equal([restored.state.classId, restored.state.advancedClassId, restored.state.masteryClassId],
        [advanced.parent, advanced.id, mastery.id], `${mastery.id} path changed on restore`);
      assert(restored.version === snapshot.run.version && app.isValidRun(restored), "save version/validity changed");
    }
    const invalid = clone(snapshot.run);
    Object.assign(invalid.state, { level: 9, advancedClassId: "assassin", masteryClassId: "darkblade" });
    assert(!app.isValidRun(invalid), "cross-branch save accepted");
  });
  check("every legacy class restores at the original level boundaries", () => {
    for (const [id, path] of Object.entries(legacyPaths)) {
      for (const level of [1, 3, 6, 9]) {
        for (const hasSubclass of [false, true]) {
          if (hasSubclass && level < 3) continue;
          const next = clone(snapshot);
          const saved = next.run.state;
          Object.assign(saved, {
            classId: id, level, xp: 0,
            subclassId: hasSubclass ? "guardian" : null,
            subclassRank: hasSubclass ? model.LEGACY_SUBCLASS_LEVELS.filter((threshold) => level >= threshold).length : 0,
          });
          delete saved.advancedClassId;
          delete saved.masteryClassId;
          delete saved.pendingClassLevels;
          assert(app.isValidRun(next.run), `${id}/${level}/${hasSubclass} legacy save rejected`);
          app.restoreCloudSave(next);
          app.resumeGame();
          const restored = app.getCloudSaveSnapshot().run;
          equal([restored.state.classId, restored.state.advancedClassId, restored.state.masteryClassId],
            [path[0], level >= 3 && hasSubclass ? path[1] : null, level >= 9 && hasSubclass ? path[2] : null],
            `${id}/${level} migration changed`);
          equal(restored.state.pendingClassLevels, level >= 3 && !hasSubclass ? [3] : [], "pending choice changed");
          assert(!("subclassId" in restored.state) && !("subclassRank" in restored.state), "legacy fields retained");
          assert(app.isValidRun(restored), "migrated save rejected");
        }
      }
    }
  });
  const reloaded = new Promise((resolve) => frame.addEventListener("load", resolve, { once: true }));
  app.location.reload();
  await reloaded;
  check("saved class path survives page reload with the new script order", () => {
    frame.contentWindow.resumeGame();
    const run = frame.contentWindow.getCloudSaveSnapshot().run;
    equal([run.state.classId, run.state.advancedClassId, run.state.masteryClassId],
      legacyPaths.berserker, "class path lost on reload");
    assert(frame.contentWindow.isValidRun(run), "reloaded save rejected");
  });
  document.getElementById("result").dataset.result = failures.length ? "fail" : "pass";
  document.getElementById("result").textContent = failures.length ? "FAIL" : "PASS";
  if (failures.length) log.textContent += failures.join("\n");
})().catch((error) => {
  document.getElementById("result").dataset.result = "fail";
  document.getElementById("result").textContent = "FAIL";
  document.getElementById("log").textContent += `${error.stack}\n`;
});
</script>
