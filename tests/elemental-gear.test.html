<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <title>Тесты стихийного снаряжения</title>
  </head>
  <body>
    <h1 id="result">RUNNING</h1>
    <pre id="log"></pre>
    <script src="../elemental-gear-model.js"></script>
    <script src="../dungeon-model.js"></script>
    <script src="../tavern-model.js"></script>
    <script src="../expeditions-model.js"></script>
    <script src="../homestead-model.js"></script>
    <script src="../soul-crafting-model.js"></script>
    <script>
      "use strict";

      const output = document.getElementById("log");
      const failures = [];
      const model = window.WellElementalGearModel;
      function assert(condition, message) {
        if (!condition) throw new Error(message);
      }
      function check(name, action) {
        try {
          action();
          output.textContent += `PASS ${name}\n`;
        } catch (error) {
          failures.push(`${name}: ${error.message}`);
          output.textContent += `FAIL ${name}: ${error.message}\n`;
        }
      }
      function grant(state, resourceId, source, index) {
        const result = model.grant(state, 30, resourceId, `drop-${index}`, source, index);
        assert(result.ok, `${resourceId} grant`);
        return result.state;
      }

      check("level-30 gates, exact event sources and legacy defaults", () => {
        assert(!model.grant(model.createState(), 29, "emberglass", "locked", "ore-careful").ok,
          "level 29 cannot receive materials");
        assert(!model.createEssence(model.createState(), 29, "emberglass", "locked-essence").ok,
          "level 29 cannot craft essence");
        assert(!model.grant(model.createState(), 30, "emberglass", "wrong-source", "fish-shiny").ok,
          "a material cannot be minted from an unrelated event");
        const oldState = model.withDefaults(undefined);
        assert(model.isValidState(oldState) && oldState.balances.emberglass === 0,
          "old saves gain an empty valid crafting ledger");
      });

      check("all six original recipes have exactly one +100% and one -50% tradeoff", () => {
        assert(Object.keys(model.RECIPES).length === 6, "six gear variants exist");
        for (const recipe of Object.values(model.RECIPES)) {
          const attributes = {
            strength: recipe.advantage === "strength" ? 100 : recipe.drawback === "strength" ? -50 : 0,
            agility: recipe.advantage === "agility" ? 100 : recipe.drawback === "agility" ? -50 : 0,
            endurance: recipe.advantage === "endurance" ? 100 : recipe.drawback === "endurance" ? -50 : 0,
          };
          assert(model.isValidAttributes(attributes, recipe), `${recipe.id} modifier shape`);
          assert(["weapon", "armor"].includes(recipe.type), `${recipe.id} uses an existing slot`);
        }
      });

      check("essence consumes one material and water; critical results double output", () => {
        let state = model.createState();
        state = grant(state, "emberglass", "ore-careful", 1);
        state = grant(state, "primalWater", "grove-drink", 2);
        const critical = model.createEssence(state, 30, "emberglass", "essence-crit", () => 0.079, 3);
        assert(critical.ok && critical.critical && critical.state.balances.emberEssence === 2,
          "a roll below the critical threshold yields two essence");
        assert(critical.state.balances.emberglass === 0 && critical.state.balances.primalWater === 0,
          "both inputs are consumed atomically");
        state = grant(state, "emberglass", "ore-careful", 4);
        state = grant(state, "primalWater", "grove-drink", 5);
        const ordinary = model.createEssence(state, 30, "emberglass", "essence-normal", () => 0.08, 6);
        assert(ordinary.ok && !ordinary.critical && ordinary.state.balances.emberEssence === 1,
          "a roll at the threshold produces one essence");
        const dry = grant(model.createState(), "emberglass", "ore-careful", 7);
        const failed = model.createEssence(dry, 30, "emberglass", "essence-no-water", () => 0.5, 8);
        assert(!failed.ok && model.isValidState(dry) &&
          dry.balances.emberglass === 1 && dry.balances.primalWater === 0,
          "missing water leaves every balance unchanged");
      });

      check("craft spends exact inputs once, validates receipts, and rejects missing stock", () => {
        let state = model.createState();
        state = grant(state, "emberglass", "ore-careful", 10);
        state = grant(state, "primalWater", "grove-drink", 11);
        state = model.createEssence(state, 30, "emberglass", "essence-for-craft", () => 0.5, 12).state;
        state = grant(state, "heartFragment", "keeper-defeat", 13);
        state = grant(state, "recipeBook", "book-study", 14);
        const before = JSON.stringify(state);
        const id = crypto.randomUUID();
        const crafted = model.craft(state, 30, "ember-edge", id, 15);
        const forged = model.apply(state, {
          id: "forged-craft", kind: "craft", recipeId: "ember-edge", createdAt: 15,
        });
        assert(crafted.ok && !forged.ok && JSON.stringify(state) === before &&
          model.isValidState(crafted.state) && model.inventory(crafted.state).length === 1 &&
          crafted.state.balances.emberEssence === 0 && crafted.state.balances.heartFragment === 0 &&
          crafted.state.balances.recipeBook === 0, "one receipt spends only the recipe inputs");
        assert(model.craft(crafted.state, 30, "ember-edge", id, 15).duplicate,
          "same UUID and payload is idempotent");
        assert(!model.craft(crafted.state, 30, "ember-edge", crypto.randomUUID(), 16).ok &&
          !model.craft(state, 29, "ember-edge", crypto.randomUUID(), 16).ok,
          "insufficient materials and level gate cannot create gear");
        const remote = model.craft(state, 30, "ember-edge", crypto.randomUUID(), 100).state;
        for (let retry = 0; retry < 2; retry++) {
          let error;
          try { model.merge(JSON.parse(JSON.stringify(crafted.state)), remote); } catch (caught) { error = caught; }
          assert(error?.message.includes("Конфликт стихийных ресурсов"), "conflicting gear merge throws on every retry");
        }
        const selected = model.equip(crafted.state, "weapon", id, crypto.randomUUID(), 15);
        assert(selected.ok && model.equipped(selected.state)[0] === "ember-edge" &&
          model.equipped(model.merge(selected.state, state))[0] === "ember-edge",
          "selection follows owned gear and survives stale cloud merge");
        assert(!model.equip(state, "weapon", id, crypto.randomUUID(), 17).ok &&
          !model.equip(crafted.state, "armor", id, crypto.randomUUID(), 17).ok,
          "unowned gear and wrong slot are rejected");
        assert(model.equipped(model.equip(selected.state, "weapon", null, crypto.randomUUID(), 18).state).length === 0,
          "unequip persists without spending stock");
      });

      check("PvE damage effects are bounded, temporary and absent from PvP", () => {
        const all = Array(20).fill("ember-edge").concat(Array(20).fill("root-guard"));
        const effects = model.combatEffects(all);
        assert(effects.outgoingDamage === 0.10 && effects.incomingReduction === 0.10, "aggregate caps at ten percent");
        const dungeon = window.DungeonModel;
        const player = dungeon.createFighter({ hp: 1000, attack: 100, accuracy: 1, concentration: 0 });
        const enemy = dungeon.createFighter({ hp: 1000, attack: 100, accuracy: 1, concentration: 0 });
        const plain = dungeon.pveRound(player, enemy, () => 0.5);
        const boosted = dungeon.pveRound(player, enemy, () => 0.5, effects);
        assert(plain.target.hp === 900 && boosted.target.hp === 890 &&
          plain.actor.hp === 900 && boosted.actor.hp === 910, "PvE applies +10% and -10%");
        assert(boosted.actor.attack === player.attack && boosted.actor.armor === player.armor &&
          JSON.stringify(dungeon.pvpTurn({ ...boosted.actor, hp: plain.actor.hp }, enemy, "attack", () => 0.5)) ===
          JSON.stringify(dungeon.pvpTurn(plain.actor, enemy, "attack", () => 0.5)),
          "PvP output remains identical after normalizing actual battle HP");
        const small = dungeon.pveRound({ ...player, attack: 9 }, { ...enemy, attack: 9 }, () => 0.5, effects);
        assert(small.actor.hp === 991 && small.target.hp === 991, "rounding never exceeds the cap on small hits");
        const skill = dungeon.pveRound({ ...player, skillType: "blast", skillDamage: 100, concentration: 1 },
          { ...enemy, skillType: "blast", skillDamage: 100, concentration: 1 }, () => 0.5, effects);
        assert(skill.target.hp === 780 && skill.actor.hp === 820, "attack skills receive the same bounded effects");
        assert(model.isValidLoadout([]) && !model.isValidLoadout(["ember-edge", "root-spear"]),
          "legacy empty and separate slot validation");
      });

      check("all six recipes debit their own essence and require every ingredient", () => {
        for (const recipe of Object.values(model.RECIPES)) {
          const stock = model.createState();
          for (const [id, amount] of Object.entries(model.cost(recipe.id))) {
            stock.base[id] = stock.balances[id] = amount;
          }
          for (const resourceId of Object.keys(model.cost(recipe.id))) {
            const short = JSON.parse(JSON.stringify(stock));
            short.base[resourceId] = short.balances[resourceId] = 0;
            const before = JSON.stringify(short);
            assert(!model.craft(short, 30, recipe.id, crypto.randomUUID(), 1).ok &&
              JSON.stringify(short) === before, `${recipe.id} requires ${resourceId} without partial debit`);
          }
          const crafted = model.craft(stock, 30, recipe.id, crypto.randomUUID(), 1);
          const selected = model.equip(crafted.state, recipe.type, model.inventory(crafted.state)[0].id,
            crypto.randomUUID(), 2);
          assert(crafted.ok && model.isValidState(selected.state) &&
            model.equipped(JSON.parse(JSON.stringify(selected.state)))[0] === recipe.id &&
            Object.values(crafted.state.balances).every((amount) => amount === 0),
            `${recipe.id} craft, preparation and reload`);
        }
      });

      check("offline last-material conflicts reject atomically across successive merges and reload", () => {
        let stock = grant(model.createState(), "emberglass", "ore-careful", 1);
        stock = grant(stock, "primalWater", "grove-drink", 2);
        const left = model.createEssence(stock, 30, "emberglass", "craft-a", () => 0.5, 3).state;
        const right = model.createEssence(stock, 30, "emberglass", "craft-b", () => 0.5, 100).state;
        const original = JSON.stringify(left);
        for (let attempt = 0; attempt < 2; attempt += 1) {
          let error;
          try { model.merge(JSON.parse(original), right); } catch (caught) { error = caught; }
          assert(error?.message.includes("Конфликт стихийных ресурсов"),
            "incompatible valid saves throw instead of dropping a receipt");
          assert(JSON.stringify(left) === original, "rejected merge cannot change local state");
        }
        const reloaded = JSON.parse(original);
        assert(model.isValidState(reloaded) && reloaded.transactions.some((entry) => entry.id === "craft-a"),
          "reload retains the original complete ledger after rejection");
        const stale = model.merge(reloaded, stock);
        assert(stale.balances.emberEssence === 1 && stale.balances.emberglass === 0 &&
          model.merge(stale, reloaded).balances.emberEssence === 1,
          "compatible successive merges preserve the single debit");
        let newStock = grant(reloaded, "emberglass", "ore-careful", 10);
        newStock = grant(newStock, "primalWater", "grove-drink", 11);
        // A later explicit merge can accept both still-present receipts using new stock;
        // the earlier failed merge never claimed to accept or discard the remote operation.
        const accepted = model.merge(newStock, right);
        assert(accepted.transactions.some((entry) => entry.id === "craft-b") &&
          accepted.balances.emberEssence === 2, "later success explicitly accounts for both receipts");
      });

      check("same UUID with mismatched payload throws without choosing a winner", () => {
        const left = model.grant(model.createState(), 30, "emberglass", "same-id", "ore-careful", 1).state;
        const right = model.grant(model.createState(), 30, "primalWater", "same-id", "grove-drink", 1).state;
        const before = JSON.stringify(left);
        let error;
        try { model.merge(left, right); } catch (caught) { error = caught; }
        assert(error?.message.includes("Конфликт стихийной квитанции") && JSON.stringify(left) === before,
          "payload mismatch rejects the entire merge and preserves local input");
      });

      async function testCraftingUiAndWalletReconciliation() {
        let elemental = model.createState();
        elemental = grant(elemental, "emberglass", "ore-careful", 30);
        elemental = grant(elemental, "primalWater", "grove-drink", 31);
        elemental = grant(elemental, "heartFragment", "keeper-defeat", 32);
        elemental = grant(elemental, "recipeBook", "book-study", 33);
        const tavern = window.WellTavernModel.createState();
        tavern.characterLevel = 29;
        tavern.gold = 150;
        const meta = {
          essence: 15,
          upgrades: { vitality: 0, power: 0, supplies: 0 },
          bossesDefeated: 0,
          secretsFound: [],
          groupInboxReceipts: [],
          souls: window.WellSoulCraftingModel.createState(),
          elemental,
          tavern,
          harbor: window.WellExpeditionsModel.createState(),
          homestead: window.WellHomesteadModel.createState(),
        };
        localStorage.setItem("well-of-whispers-camp-progress", JSON.stringify(meta));
        const frame = document.createElement("iframe");
        frame.title = "Elemental crafting UI test";
        frame.src = "../index.html?elemental-crafting-test=locked";
        document.body.append(frame);
        await new Promise((resolve, reject) => {
          frame.addEventListener("load", resolve, { once: true });
          frame.addEventListener("error", reject, { once: true });
        });
        let game = frame.contentWindow;
        let doc = game.document;
        game.confirm = () => true;
        doc.getElementById("profile-soul-crafting-button").click();
        let essenceButton = doc.querySelector('[data-homestead-action="make-elemental-essence"][data-material-id="emberglass"]');
        let craftButton = doc.querySelector('[data-homestead-action="craft-elemental-gear"][data-recipe-id="ember-edge"]');
        assert(essenceButton?.disabled && craftButton?.disabled,
          "essence is level gated and recipes remain unavailable below level 30");

        const unlocked = JSON.parse(game.localStorage.getItem("well-of-whispers-camp-progress"));
        unlocked.tavern.characterLevel = 30;
        game.localStorage.setItem("well-of-whispers-camp-progress", JSON.stringify(unlocked));
        const reloaded = new Promise((resolve, reject) => {
          frame.addEventListener("load", resolve, { once: true });
          frame.addEventListener("error", reject, { once: true });
        });
        frame.src = "../index.html?elemental-crafting-test=unlocked";
        await reloaded;
        game = frame.contentWindow;
        doc = game.document;
        game.confirm = () => true;
        doc.getElementById("profile-soul-crafting-button").click();
        essenceButton = doc.querySelector('[data-homestead-action="make-elemental-essence"][data-material-id="emberglass"]');
        craftButton = doc.querySelector('[data-homestead-action="craft-elemental-gear"][data-recipe-id="ember-edge"]');
        assert(essenceButton && !essenceButton.disabled && craftButton?.disabled,
          "level 30 enables essence; gear still needs the essence input");
        const stale = JSON.parse(game.localStorage.getItem("well-of-whispers-camp-progress"));
        essenceButton.click();
        for (let attempt = 0; attempt < 100; attempt += 1) {
          const pending = JSON.parse(game.localStorage.getItem("well-of-whispers-camp-progress"));
          if (pending.elemental.transactions.some((entry) => entry.kind === "essence")) break;
          await new Promise((resolve) => setTimeout(resolve, 20));
        }
        let saved = JSON.parse(game.localStorage.getItem("well-of-whispers-camp-progress"));
        assert(saved.elemental.balances.emberEssence >= 1 && saved.elemental.balances.emberglass === 0 &&
          saved.elemental.balances.primalWater === 0, "UI persists essence inputs and output together");
        assert(craftButton.disabled &&
          saved.tavern.gold === 150 && saved.essence === 15 &&
          saved.tavern.stash.length === stale.tavern.stash.length &&
          saved.elemental.balances.heartFragment === 1 && saved.elemental.balances.recipeBook === 1,
        "essence conversion leaves gold, shards, stash and gear recipe inputs untouched");
        const merged = game.mergeMetaProgress(saved, stale);
        assert(merged.elemental.balances.emberEssence === saved.elemental.balances.emberEssence &&
          merged.elemental.balances.emberglass === 0 &&
          merged.elemental.balances.primalWater === 0 && game.isValidMetaProgress(merged),
        "stale merge cannot restore materials already converted to essence");
        const seed = JSON.parse(JSON.stringify(stale));
        game.localStorage.setItem("well-of-whispers-camp-progress", JSON.stringify(seed));
        const secondFrame = document.createElement("iframe");
        secondFrame.title = "Second elemental crafting tab";
        secondFrame.src = "../index.html?elemental-crafting-test=second-tab";
        const firstReload = new Promise((resolve) => frame.addEventListener("load", resolve, { once: true }));
        const secondLoad = new Promise((resolve) => secondFrame.addEventListener("load", resolve, { once: true }));
        frame.src = "../index.html?elemental-crafting-test=first-tab";
        document.body.append(secondFrame);
        await Promise.all([firstReload, secondLoad]);
        game = frame.contentWindow;
        const otherGame = secondFrame.contentWindow;
        game.confirm = otherGame.confirm = () => true;
        game.Math.random = otherGame.Math.random = () => 0.5;
        await Promise.all([
          game.handleHomesteadAction("make-elemental-essence", { materialId: "emberglass" }),
          otherGame.handleHomesteadAction("make-elemental-essence", { materialId: "emberglass" }),
        ]);
        const afterTabs = JSON.parse(game.localStorage.getItem("well-of-whispers-camp-progress"));
        assert(afterTabs.elemental.balances.emberEssence === 1 &&
          afterTabs.elemental.transactions.filter((entry) => entry.kind === "essence").length === 1 &&
          afterTabs.elemental.balances.emberglass === 0 && afterTabs.elemental.balances.primalWater === 0 &&
          afterTabs.tavern.gold === seed.tavern.gold && afterTabs.essence === seed.essence,
          "two tabs lock and reread full meta before consuming the last material exactly once");
        const reloadTabs = new Promise((resolve) => frame.addEventListener("load", resolve, { once: true }));
        frame.src = "../index.html?elemental-crafting-test=tab-reload";
        await reloadTabs;
        const afterReload = JSON.parse(frame.contentWindow.localStorage.getItem("well-of-whispers-camp-progress"));
        assert(afterReload.elemental.balances.emberEssence === 1 &&
          afterReload.elemental.transactions.filter((entry) => entry.kind === "essence").length === 1,
          "reload does not retry or multiply the two-tab conversion");
        game = frame.contentWindow;
        await Promise.all([
          game.handleHomesteadAction("craft-elemental-gear", { recipeId: "ember-edge" }),
          otherGame.handleHomesteadAction("craft-elemental-gear", { recipeId: "ember-edge" }),
        ]);
        const gearSave = JSON.parse(game.localStorage.getItem("well-of-whispers-camp-progress"));
        const gear = model.inventory(gearSave.elemental);
        assert(gear.length === 1 && gearSave.elemental.balances.emberEssence === 0 &&
          gearSave.elemental.balances.heartFragment === 0 && gearSave.elemental.balances.recipeBook === 0,
          "two real tabs craft the last recipe once under the shared lock");
        await game.handleHomesteadAction("equip-elemental-gear", { slot: "weapon", gearId: gear[0].id });
        game.eval("startGameWithClass(BASE_CLASSES[0].id)");
        assert(game.eval("JSON.stringify(state.elementalLoadout)") === '["ember-edge"]',
          "new run snapshots prepared elemental gear");
        const fighterBefore = game.eval("JSON.stringify(getDungeonFighter())");
        await game.handleHomesteadAction("equip-elemental-gear", { slot: "weapon", gearId: "" });
        assert(game.eval("JSON.stringify(state.elementalLoadout)") === '["ember-edge"]' &&
          game.eval("JSON.stringify(getDungeonFighter())") === fighterBefore,
          "camp changes cannot change running loadout or the PvP fighter formula");
        assert(game.eval(`(() => {
          const original = JSON.parse(JSON.stringify(state));
          const random = Math.random;
          Math.random = () => 0.5;
          try {
            state.attack = 100;
            state.hp = state.maxHp = 1000;
            state.room = 1;
            state.enemy = { name: "Test foe", hp: 1000, maxHp: 1000, damage: 100,
              xp: 0, gold: 0, boss: false };
            const prepared = JSON.parse(JSON.stringify(state));
            state.elementalLoadout = [];
            runPveRound();
            const plainDamage = 1000 - state.enemy.hp;
            state = prepared;
            runPveRound();
            return 1000 - state.enemy.hp === plainDamage + Math.floor(plainDamage * 0.05);
          } finally { state = original; Math.random = random; }
        })()`), "real game PvE round uses the frozen elemental loadout");
        const snapshot = game.getCloudSaveSnapshot();
        assert(game.isValidRun(snapshot.run) && game.isValidMetaProgress(snapshot.meta),
          "cloud snapshot accepts gear and loadout");
        game.saveActiveRun();
        const gearReload = new Promise((resolve) => frame.addEventListener("load", resolve, { once: true }));
        frame.src = "../index.html?elemental-crafting-test=gear-reload";
        await gearReload;
        game = frame.contentWindow;
        game.resumeGame();
        assert(game.eval("JSON.stringify(state.elementalLoadout)") === '["ember-edge"]' &&
          model.inventory(JSON.parse(game.localStorage.getItem("well-of-whispers-camp-progress")).elemental).length === 1,
          "reload preserves crafted inventory and original run loadout, not the current camp selection");
        const localCraft = JSON.parse(JSON.stringify(seed));
        const remoteCraft = JSON.parse(JSON.stringify(seed));
        localCraft.elemental = model.createEssence(seed.elemental, 30, "emberglass",
          "offline-local", () => 0.5, 40).state;
        remoteCraft.elemental = model.createEssence(seed.elemental, 30, "emberglass",
          "offline-remote", () => 0.5, 100).state;
        game.eval(`metaProgress = ${JSON.stringify(localCraft)};`);
        const memoryBefore = game.eval("JSON.stringify(metaProgress)");
        const diskBefore = JSON.stringify(remoteCraft);
        game.localStorage.setItem("well-of-whispers-camp-progress", diskBefore);
        assert(game.persistMetaProgress() === false &&
          game.eval("JSON.stringify(metaProgress)") === memoryBefore &&
          game.localStorage.getItem("well-of-whispers-camp-progress") === diskBefore,
          "persist rejects conflicting full meta before changing memory or disk");
        assert(game.persistMetaProgress() === false &&
          game.localStorage.getItem("well-of-whispers-camp-progress") === diskBefore,
          "retry cannot silently remove or accept a rejected offline debit");
        secondFrame.remove();
        frame.remove();
        output.textContent += "PASS UI level gate, essence/gear two-tab lock, camp selection, frozen run and reload\n";
      }

      testCraftingUiAndWalletReconciliation().catch((error) => {
        failures.push(`crafting UI: ${error.message}`);
        output.textContent += `FAIL crafting UI: ${error.message}\n`;
      }).finally(() => {
        document.getElementById("result").dataset.result = failures.length ? "fail" : "pass";
        document.getElementById("result").textContent = failures.length
          ? `${failures.length} FAILURES`
          : "PASS";
      });
    </script>
  </body>
</html>
