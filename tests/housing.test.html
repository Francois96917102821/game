<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <title>Тесты домов и участков</title>
    <script>
      window.addEventListener("error", (event) => {
        const result = document.getElementById("result");
        const log = document.getElementById("log");
        if (result && log) {
          result.textContent = "FAIL";
          document.body.dataset.result = "fail";
          log.textContent += `SCRIPT ERROR ${event.message}\n`;
        }
      });
    </script>
  </head>
  <body>
    <h1 id="result">RUNNING</h1>
    <pre id="log"></pre>
    <script src="../housing-model.js"></script>
    <script>
      "use strict";

      const output = document.getElementById("log");
      const failures = [];
      const model = window.WellHousingModel;
      const HOUR = model.HOUR;
      const startAt = Date.UTC(2026, 0, 1);

      function assert(condition, message) {
        if (!condition) throw new Error(message);
      }

      function check(name, action) {
        try {
          action();
          output.textContent += `PASS ${name}\n`;
        } catch (error) {
          failures.push(`${name}: ${error.message}`);
          output.textContent += `FAIL ${name}: ${error.message}\n`;
        }
      }

      function ownedHome(tier, plots, essence = 2000, now = startAt) {
        let state = model.createState();
        const purchase = model.purchaseHouse(state, { gold: 20000, essence }, tier,
          tier === "cabin" ? "gold" : "essence", `house-receipt-${tier}`, `house-${tier}`, now);
        assert(purchase.purchased, `could not purchase ${tier}`);
        state = purchase.state;
        for (let index = 0; index < plots; index += 1) {
          const result = model.buyPlot(state, 2000, `plot-receipt-${tier}-${index}`, `plot-${tier}-${index}`, now + index);
          assert(result.purchased, `could not buy plot ${index + 1}`);
          state = result.state;
        }
        return state;
      }

      function addMaterials(state, materials, id, now) {
        const result = model.recordLoot(state, materials, id, now);
        assert(!result.reason, `material delivery failed: ${result.reason}`);
        return result.state;
      }

      function setStock(state, stock) {
        const next = JSON.parse(JSON.stringify(state));
        next.stock = { ...next.stock, ...stock };
        assert(model.isValidState(next), "stock fixture must be a valid housing state");
        return next;
      }

      check("legacy meta defaults, schema validation, and safe housing migration", () => {
        assert(model.isValidState(model.createState()), "new housing state validates");
        assert(model.isValidState(model.withDefaults(undefined)), "missing housing migrates to safe defaults");
        assert(!model.isValidState({ ...model.createState(), water: 1001 }), "water above pond capacity is rejected");
        assert(!model.isValidState({ ...model.createState(), stock: { logs: -1 } }), "invalid resource counts are rejected");
        assert(!model.isValidState({ ...model.createState(), transactions: {} }),
          "malformed transaction ledgers are rejected without throwing");
      });

      check("house purchases use exact gold and shard prices with no inventory count limit", () => {
        let state = model.createState();
        let balances = { gold: 20000, essence: 1600 };
        for (let index = 0; index < 12; index += 1) {
          const result = model.purchaseHouse(state, { ...balances, gold: 20000 }, "cabin", "gold",
            `cabin-receipt-${index}`, `cabin-${index}`, startAt + index);
          assert(result.purchased && result.balances.gold === 0,
            "a cabin costs exactly 20,000 gold");
          state = result.state;
          balances = result.balances;
        }
        const sturdy = model.purchaseHouse(state, balances, "sturdy", "essence", "sturdy-receipt", "sturdy-one", startAt + 20);
        assert(sturdy.purchased && sturdy.balances.essence === 1200, "a sturdy house costs exactly 400 shards");
        const mansion = model.purchaseHouse(sturdy.state, sturdy.balances, "mansion", "sturdy-upgrade",
          "mansion-receipt", "mansion-one", startAt + 21);
        assert(mansion.purchased && mansion.balances.essence === 600, "sturdy-house upgrade to mansion costs exactly 600 shards");
        const direct = model.purchaseHouse(model.createState(), { gold: 0, essence: 1000 }, "mansion", "essence",
          "direct-mansion", "mansion-direct", startAt);
        assert(direct.purchased && direct.balances.essence === 0, "direct mansion purchase costs exactly 1,000 shards");
        const altered = JSON.parse(JSON.stringify(direct.state));
        altered.transactions[0].costs.essence = 1;
        assert(!model.isValidState(altered), "save validation rejects a tampered house price");
      });

      check("best owned house is selected automatically and plots remain after a tier increase", () => {
        let state = ownedHome("cabin", 2);
        assert(model.activeHouse(state).tier === "cabin" && model.activePlotLimit(state) === 2,
          "a cabin sets the two-plot limit");
        let blocked = model.buyPlot(state, 1000, "plot-blocked", "plot-blocked", startAt + 3);
        assert(!blocked.purchased && blocked.reason === "cap", "a cabin cannot exceed two purchased plots");
        const sturdy = model.purchaseHouse(state, { gold: 0, essence: 400 }, "sturdy", "essence",
          "sturdy-upgrade-receipt", "sturdy-house", startAt + 4);
        state = sturdy.state;
        assert(model.activeHouse(state).tier === "sturdy" && model.activePlotLimit(state) === 4 &&
          state.plots.length === 2, "the sturdy home becomes active without losing prior plots");
        const mansion = model.purchaseHouse(state, { gold: 0, essence: 1000 }, "mansion", "essence",
          "mansion-increase", "mansion-increase", startAt + 5);
        let mansionState = mansion.state;
        for (let index = 2; index < 6; index += 1) {
          const result = model.buyPlot(mansionState, 1000,
            `mansion-plot-${index}`, `mansion-plot-${index}`, startAt + 6 + index);
          assert(result.purchased, `mansion plot ${index + 1} should fit its six-plot limit`);
          mansionState = result.state;
        }
        assert(mansionState.plots.length === 6 && model.activePlotLimit(mansionState) === 6,
          "a mansion allows six active plots");
      });

      check("dungeon material finds observe a two-hour cooldown", () => {
        const first = model.recordLoot(model.createState(), { logs: 2 }, "find-one", startAt);
        const early = model.recordLoot(first.state, { ore: 2 }, "find-early", startAt + HOUR);
        assert(early.reason === "cooldown", "a second resource find is blocked inside two hours");
        const ready = model.recordLoot(first.state, { ore: 2 }, "find-ready", startAt + 2 * HOUR);
        assert(!ready.reason && ready.state.stock.ore === 2, "material harvesting resumes after two hours");
      });

      check("workshop recipes, upgrades, and daily processing limits are enforced", () => {
        let state = ownedHome("sturdy", 4);
        state = addMaterials(state, { logs: 10, stone: 10 }, "raw-workshops", startAt + HOUR);
        let build = model.construct(state, "plot-sturdy-0", "boards", "build-boards", startAt + HOUR);
        assert(build.built && build.level === 1, "boards workshop uses five logs and five stone");
        state = model.construct(build.state, "plot-sturdy-1", "blocks", "build-blocks", startAt + HOUR + 1).state;
        state = addMaterials(state, { logs: 9 }, "raw-logs", startAt + 3 * HOUR);
        for (let index = 0; index < 3; index += 1) {
          const result = model.craft(state, "plot-sturdy-0", `craft-${index}`, startAt + 3 * HOUR + index * 1000);
          assert(result.crafted, "three logs are converted to one board");
          state = result.state;
        }
        const limited = model.craft(state, "plot-sturdy-0", "craft-over-limit", startAt + 3 * HOUR + 4000);
        assert(!limited.crafted && limited.reason === "daily-limit", "level one permits exactly three crafts a day");
        state = addMaterials(state, { logs: 5, stone: 5 }, "upgrade-materials", startAt + 5 * HOUR);
        const upgraded = model.construct(state, "plot-sturdy-0", "boards", "upgrade-boards", startAt + 5 * HOUR);
        assert(upgraded.built && upgraded.level === 2, "workshop levels use the same documented recipe");
        state = addMaterials(upgraded.state, { logs: 3 }, "after-upgrade-materials", startAt + 7 * HOUR);
        const fourth = model.craft(state, "plot-sturdy-0", "craft-fourth", startAt + 7 * HOUR + 1000);
        assert(fourth.crafted && fourth.remaining === 0, "level two permits four crafts a day");
      });

      check("warehouse grants 20 + 10 per level extra capacity and blocks over-capacity loot", () => {
        let state = ownedHome("mansion", 6);
        state = setStock(state, { boards: 5, blocks: 5, ingots: 3, cloth: 3 });
        state = model.construct(state, "plot-mansion-0", "shed", "build-shed", startAt).state;
        assert(model.materialCapacity(state) === 50, "base 20 plus 30 warehouse capacity at level one");
        const fill = model.recordLoot(state, { logs: 10, stone: 10, ore: 10, flax: 10, boards: 10, blocks: 10 },
          "warehouse-fill", startAt + HOUR);
        assert(Object.values(fill.state.stock).reduce((sum, count) => sum + count, 0) === 50,
          "stored construction materials never exceed the available capacity");
        const overflow = model.recordLoot(fill.state, { ingots: 1 }, "warehouse-overflow", startAt + 3 * HOUR);
        assert(overflow.added.ingots === 0 && model.isValidState(overflow.state),
          "full storage drops no items into an invalid save");
      });

      check("pond fishing requires 300 water, respects the 8-hour timer, and caps water at 1,000", () => {
        let state = ownedHome("mansion", 6);
        state = setStock(state, { boards: 5, blocks: 5, ingots: 3, cloth: 3 });
        state = model.construct(state, "plot-mansion-0", "shed", "fish-shed", startAt).state;
        state = setStock(state, { ...state.stock, boards: 10, blocks: 10, ingots: 5, cloth: 5 });
        state = model.construct(state, "plot-mansion-1", "pond", "build-pond", startAt + HOUR).state;
        const thirsty = model.fish(state, "plot-mansion-1", "fish-dry", startAt + HOUR);
        assert(!thirsty.caught && thirsty.reason === "water", "fishing is unavailable below 300 water");
        state = addMaterials(state, { water: 100 }, "pond-water-1", startAt + 2 * HOUR);
        state = addMaterials(state, { water: 100 }, "pond-water-2", startAt + 4 * HOUR);
        state = addMaterials(state, { water: 100 }, "pond-water-3", startAt + 6 * HOUR);
        const catchOne = model.fish(state, "plot-mansion-1", "fish-one", startAt + 6 * HOUR);
        assert(catchOne.caught && catchOne.bait === 3 && catchOne.state.bait === 3 && catchOne.state.water === 300,
          "level one returns three bait without consuming pond water");
        const early = model.fish(catchOne.state, "plot-mansion-1", "fish-early", startAt + 13 * HOUR);
        assert(!early.caught && early.reason === "cooldown", "a second catch is blocked before eight hours");
        const catchTwo = model.fish(catchOne.state, "plot-mansion-1", "fish-two", startAt + 14 * HOUR);
        assert(catchTwo.caught, "fishing is available again after the cooldown");
        const fullPond = JSON.parse(JSON.stringify(catchTwo.state));
        fullPond.water = 999;
        const water = model.recordLoot(fullPond, { water: 10 }, "more-water", startAt + 16 * HOUR);
        assert(water.state.water === 1000, "ordinary water storage is capped at 1,000");
      });

      check("garden cooldown, seed planting, and the 10-to-12-hour second watering are enforced", () => {
        let state = ownedHome("mansion", 6);
        state = setStock(state, { boards: 5, blocks: 5, ingots: 3, cloth: 3 });
        state = model.construct(state, "plot-mansion-0", "shed", "garden-shed", startAt).state;
        state = setStock(state, { ...state.stock, boards: 15, blocks: 15, ingots: 5, cloth: 5 });
        state = model.construct(state, "plot-mansion-1", "garden", "build-garden", startAt + HOUR).state;
        const harvest = model.collectGarden(state, "plot-mansion-1", "garden-first", startAt + HOUR);
        assert(harvest.collected && harvest.plants === 3 && harvest.seeds === 1, "level one gathers three plants and a seed");
        const earlyHarvest = model.collectGarden(harvest.state, "plot-mansion-1", "garden-early",
          startAt + 20 * HOUR);
        assert(!earlyHarvest.collected && earlyHarvest.reason === "cooldown", "the garden requires a full 20 hours");
        state = addMaterials(harvest.state, { water: 2 }, "garden-water", startAt + 2 * HOUR);
        const planted = model.plantCrop(state, "plot-mansion-1", "plant-first", startAt + 2 * HOUR);
        assert(planted.planted && planted.state.water === 1, "planting consumes a seed and the immediate first watering");
        const tooSoon = model.waterCrop(planted.state, "water-too-soon", startAt + 2 * HOUR + 9 * HOUR);
        assert(!tooSoon.watered && tooSoon.reason === "too-soon", "the second watering cannot happen before ten hours");
        const watered = model.waterCrop(planted.state, "water-second", startAt + 12 * HOUR);
        assert(watered.watered && watered.state.grain === 1 && watered.state.crop === null,
          "the second watering within the 10–12-hour window yields one grain exactly once");
        const missed = model.waterCrop(planted.state, "water-late", startAt + 15 * HOUR);
        assert(!missed.watered && missed.reason === "window-missed", "missed watering windows do not grant crops");
        const tooEarlyToDiscard = model.discardExpiredCrop(planted.state, "discard-early", startAt + 12 * HOUR);
        assert(!tooEarlyToDiscard.discarded, "an unexpired crop cannot be discarded as failed");
        const discarded = model.discardExpiredCrop(planted.state, "discard-late", startAt + 15 * HOUR);
        const staleMerge = model.merge(discarded.state, planted.state);
        assert(discarded.discarded && discarded.state.crop === null && discarded.state.grain === 0 &&
          staleMerge.crop === null && model.isValidState(staleMerge),
        "an expired crop can be removed without reward and cannot return from a stale cloud snapshot");
      });

      check("altar prices and confirmed maximum levels are available without selling unsupported upgrades", () => {
        assert(model.altarCost(0) === 100 && model.altarCost(4) === 500,
          "the next altar level costs 100 times current level plus one");
        assert(model.altarAtCap("fishing", 15) && model.altarAtCap("runes", 20),
          "fishing and rune altar caps are validated");
        assert(!model.altarAtCap("strength", 20), "unspecified maximum levels are not invented");
        let state = ownedHome("mansion", 6);
        state.plots[0].building = { type: "pond", level: 18, builtAt: startAt };
        state.plots[1].building = { type: "shed", level: 1, builtAt: startAt };
        state.plots[2].building = { type: "garden", level: 8, builtAt: startAt };
        state = setStock(state, { boards: 10, blocks: 10, ingots: 5, cloth: 5 });
        assert(model.isValidState(state), "pond and garden maximum-level save is valid");
        assert(model.construct(state, "plot-mansion-0", "pond", "pond-level-cap", startAt + 1).reason === "max-level" &&
          model.construct(state, "plot-mansion-2", "garden", "garden-level-cap", startAt + 1).reason === "max-level",
        "pond level 18 and garden level 8 cannot be exceeded");
      });

      check("sleep uses the best house duration, runs offline, and clears injuries only when claimed", () => {
        let state = ownedHome("cabin", 2);
        state = model.startSleep(state, "sleep-cabin", startAt).state;
        assert(state.sleep.endsAt - state.sleep.startedAt === 160 * 60000, "cabin sleep lasts exactly 2 h 40 min");
        const early = model.claimSleep(state, "sleep-early", 2, state.sleep.endsAt - 1);
        assert(!early.claimed && early.injuries === 2, "injuries remain until the timer has elapsed");
        const rested = model.claimSleep(state, "sleep-claim", 2, state.sleep.endsAt);
        assert(rested.claimed && rested.injuries === 0, "claiming completed sleep removes injuries exactly once");
        const duplicate = model.claimSleep(rested.state, "sleep-again", 2, state.sleep.endsAt + 1);
        assert(!duplicate.claimed, "sleep rewards cannot be claimed twice");
        const sturdy = model.startSleep(ownedHome("sturdy", 4), "sleep-sturdy", startAt);
        const mansion = model.startSleep(ownedHome("mansion", 6), "sleep-mansion", startAt);
        assert(sturdy.state.sleep.endsAt - startAt === 140 * 60000 &&
          mansion.state.sleep.endsAt - startAt === 120 * 60000,
        "sturdy and mansion rest durations are exactly 2 h 20 min and 2 h");
      });

      check("cloud merge keeps purchases, plots, resources, levels, and debits from both devices", () => {
        const base = model.createState();
        const left = model.purchaseHouse(base, { gold: 0, essence: 1000 }, "sturdy", "essence",
          "merge-left-house", "merge-house-left", startAt).state;
        const right = model.purchaseHouse(base, { gold: 0, essence: 1000 }, "sturdy", "essence",
          "merge-right-house", "merge-house-right", startAt + 1).state;
        const merged = model.merge(left, right);
        const costs = model.mergeCosts(left, right);
        assert(merged.houses.length === 2 && model.isValidState(merged),
          "separately purchased homes from both devices survive the merge");
        assert(costs.essenceFromLeft === 400 && costs.essenceFromRight === 400,
          "the merge reports each independent shard debit exactly once");
        let structure = ownedHome("sturdy", 4);
        structure = addMaterials(structure, { logs: 10, stone: 10 }, "merge-raw", startAt);
        structure = model.construct(structure, "plot-sturdy-0", "boards", "merge-build", startAt).state;
        structure = addMaterials(structure, { logs: 5, stone: 5 }, "merge-upgrade-raw", startAt + 3 * HOUR);
        structure = model.construct(structure, "plot-sturdy-0", "boards", "merge-upgrade", startAt + 3 * HOUR).state;
        const crossDevice = model.merge(structure, base);
        assert(crossDevice.plots.length === structure.plots.length &&
          crossDevice.plots[0].building.level === 2 && model.isValidState(crossDevice),
          "building levels and purchased slots survive a stale-device merge");
        let shared = ownedHome("sturdy", 4);
        shared = addMaterials(shared, { logs: 10, stone: 10 }, "concurrent-build-start", startAt);
        shared = model.construct(shared, "plot-sturdy-0", "boards", "concurrent-build-base",
          startAt + HOUR).state;
        shared = addMaterials(shared, { logs: 5, stone: 5 }, "concurrent-build-more", startAt + 3 * HOUR);
        const leftLevelTwo = model.construct(shared, "plot-sturdy-0", "boards", "concurrent-upgrade-left",
          startAt + 4 * HOUR);
        const leftLevelThree = model.construct(leftLevelTwo.state, "plot-sturdy-0", "boards",
          "concurrent-upgrade-left-again", startAt + 4 * HOUR);
        const rightLevelTwo = model.construct(shared, "plot-sturdy-0", "boards", "concurrent-upgrade-right",
          startAt + 4 * HOUR);
        const concurrentMerge = model.merge(rightLevelTwo.state, leftLevelThree.state);
        assert(concurrentMerge.plots[0].building.level === 3 && model.isValidState(concurrentMerge),
          "concurrent upgrades with equal timestamps retain the highest building level");
      });

      check("offline timers and harvested crop completions are idempotent across device merges", () => {
        let state = ownedHome("mansion", 6);
        state = setStock(state, { boards: 5, blocks: 5, ingots: 3, cloth: 3 });
        state = model.construct(state, "plot-mansion-0", "shed", "merge-crop-shed", startAt).state;
        state = setStock(state, { ...state.stock, boards: 15, blocks: 15, ingots: 5, cloth: 5 });
        state = model.construct(state, "plot-mansion-1", "garden", "merge-crop-garden", startAt + HOUR).state;
        state = model.collectGarden(state, "plot-mansion-1", "merge-crop-harvest", startAt + HOUR).state;
        state = addMaterials(state, { water: 2 }, "merge-crop-water", startAt + 2 * HOUR);
        const planted = model.plantCrop(state, "plot-mansion-1", "merge-crop-plant", startAt + 2 * HOUR).state;
        const deviceWithHarvest = model.waterCrop(planted, "merge-crop-watered", startAt + 12 * HOUR).state;
        const merged = model.merge(deviceWithHarvest, planted);
        assert(merged.crop === null && merged.grain === 1 && model.isValidState(merged),
          "a stale device cannot restore an already collected crop");
      });

      async function browserUi() {
        localStorage.setItem("well-of-whispers-camp-progress", JSON.stringify({
          essence: 1000,
          upgrades: { vitality: 0, power: 0, supplies: 0 },
          bossesDefeated: 0,
          secretsFound: [],
          groupInboxReceipts: [],
        }));
        const frame = document.createElement("iframe");
        frame.title = "Проверка интерфейса дома";
        frame.style.width = "390px";
        frame.style.height = "760px";
        frame.src = "../index.html?housing-test=1";
        document.body.append(frame);
        await new Promise((resolve, reject) => {
          frame.addEventListener("load", resolve, { once: true });
          frame.addEventListener("error", reject, { once: true });
        });
        const gameWindow = frame.contentWindow;
        const gameDocument = gameWindow.document;
        const confirmations = [];
        gameWindow.confirm = (message) => {
          confirmations.push(message);
          return true;
        };
        assert(gameWindow.eval(`(() => {
          const old = {
            essence: 50,
            upgrades: { vitality: 0, power: 0, supplies: 0 },
            bossesDefeated: 0,
            secretsFound: [],
            groupInboxReceipts: [],
          };
          return isValidMetaProgress(old) && normalizeMetaProgress(old).housing.houses.length === 0;
        })()`), "legacy cloud snapshots migrate without losing existing fields");
        const baseMeta = gameWindow.createMetaProgress(Date.now());
        baseMeta.essence = 1000;
        const left = JSON.parse(JSON.stringify(baseMeta));
        const right = JSON.parse(JSON.stringify(baseMeta));
        const leftPurchase = gameWindow.WellHousingModel.purchaseHouse(left.housing,
          { gold: 0, essence: left.essence }, "sturdy", "essence", "cloud-home-left", "cloud-house-left", Date.now());
        left.housing = leftPurchase.state;
        left.essence = leftPurchase.balances.essence;
        const rightPurchase = gameWindow.WellHousingModel.purchaseHouse(right.housing,
          { gold: 0, essence: right.essence }, "sturdy", "essence", "cloud-home-right", "cloud-house-right", Date.now());
        right.housing = rightPurchase.state;
        right.essence = rightPurchase.balances.essence;
        const cloudMerge = gameWindow.mergeMetaProgress(left, right);
        assert(cloudMerge.housing.houses.length === 2 && cloudMerge.essence === 200,
          "independent device home purchases merge without losing ownership or refunding 800 shards");
        const staleMerge = gameWindow.mergeMetaProgress(left, baseMeta);
        assert(staleMerge.essence === 600 && staleMerge.housing.houses.length === 1,
          "an older cloud snapshot cannot erase a house or refund its shard cost");
        gameWindow.eval("metaProgress.tavern.gold = 20000; metaProgress.essence = 1000; persistMetaProgress(); render();");
        const click = (selector) => {
          const element = gameDocument.querySelector(selector);
          assert(element, `missing UI element ${selector}`);
          element.click();
          return element;
        };
        click('[data-city-action="houses"]');
        assert(gameDocument.querySelector("#housing-dialog").open, "home shop opens from the city profile");
        const rollback = gameWindow.eval(`(() => {
          const prototype = Storage.prototype;
          const originalSetItem = prototype.setItem;
          prototype.setItem = function (key, value) {
            if (key === "well-of-whispers-camp-progress") throw new Error("simulated storage failure");
            return originalSetItem.call(this, key, value);
          };
          try { document.querySelector('[data-housing-action="purchase-house"][data-tier="cabin"]').click(); }
          finally { prototype.setItem = originalSetItem; }
          const saved = JSON.parse(localStorage.getItem("well-of-whispers-camp-progress"));
          return { gold: metaProgress.tavern.gold, homes: metaProgress.housing.houses.length,
            savedGold: saved.tavern.gold, savedHomes: saved.housing.houses.length };
        })()`);
        assert(rollback.gold === 20000 && rollback.homes === 0 &&
          rollback.savedGold === 20000 && rollback.savedHomes === 0,
        "failed local persistence rolls the home purchase and permanent-gold debit back");
        click('[data-housing-action="purchase-house"][data-tier="cabin"]');
        let saved = JSON.parse(gameWindow.localStorage.getItem("well-of-whispers-camp-progress"));
        assert(saved.housing.houses.length === 1 && saved.tavern.gold === 0,
          "the cabin purchase charges persistent gold and is saved");
        click('[data-district="upper"]');
        assert(gameDocument.querySelector("#district-lock-note").hidden,
          "the district tab refreshes to the unlocked state after purchase");
        click('[data-city-action="houses"]');
        click('[data-housing-action="purchase-house"][data-tier="sturdy"]');
        saved = JSON.parse(gameWindow.localStorage.getItem("well-of-whispers-camp-progress"));
        assert(saved.housing.houses.length === 2 && saved.essence === 600 &&
          gameWindow.WellHousingModel.activeHouse(saved.housing).tier === "sturdy",
        "premium home purchase is confirmed, charged once, and auto-selects the higher tier");
        assert(gameDocument.querySelector("#housing-content").textContent.includes("Добротный дом × 1"),
          "the profile lists owned houses by type and quantity");
        for (let index = 0; index < 4; index += 1) {
          click('[data-housing-action="buy-plot"]');
        }
        saved = JSON.parse(gameWindow.localStorage.getItem("well-of-whispers-camp-progress"));
        assert(saved.housing.plots.length === 4 && saved.essence === 200,
          "four plots each cost exactly 100 shards");
        assert(gameDocument.querySelector('[data-housing-action="buy-plot"]').disabled,
          "the current home's plot cap is enforced in the interface");
        assert(confirmations.some((message) => message.includes("400 осколков")) &&
          confirmations.filter((message) => message.includes("100 осколков")).length === 4,
        "the UI states the exact shard charge in each confirmation");
        const waterFind = gameWindow.eval(`(() => {
          const originalRandom = Math.random;
          const values = [0, 0.99, 0.5];
          Math.random = () => values.length ? values.shift() : 0.5;
          try { discoverHousingMaterials(); } finally { Math.random = originalRandom; }
          return metaProgress.housing.water;
        })()`);
        assert(waterFind === 75, "hall exploration persists the documented 50–100 water find");
        const goldBase = JSON.parse(JSON.stringify(baseMeta));
        goldBase.tavern.gold = 50000;
        const cabinLeft = JSON.parse(JSON.stringify(goldBase));
        const cabinRight = JSON.parse(JSON.stringify(goldBase));
        for (const [source, suffix] of [[cabinLeft, "left"], [cabinRight, "right"]]) {
          const cabin = gameWindow.WellHousingModel.purchaseHouse(source.housing,
            { gold: source.tavern.gold, essence: source.essence }, "cabin", "gold",
            `cloud-cabin-${suffix}`, `cloud-cabin-house-${suffix}`, Date.now());
          source.housing = cabin.state;
          source.tavern.gold = cabin.balances.gold;
        }
        const goldMerge = gameWindow.mergeMetaProgress(cabinLeft, cabinRight);
        assert(goldMerge.housing.houses.length === 2 && goldMerge.tavern.gold === 10000,
          "parallel cabin purchases merge without refunding their permanent-gold charges");
        const reload = new Promise((resolve, reject) => {
          frame.addEventListener("load", resolve, { once: true });
          frame.addEventListener("error", reject, { once: true });
        });
        frame.src = "../index.html?housing-test=reload";
        await reload;
        saved = JSON.parse(frame.contentWindow.localStorage.getItem("well-of-whispers-camp-progress"));
        assert(saved.housing.houses.length === 2 && saved.housing.plots.length === 4,
          "home ownership and plot inventory survive a browser reload");
        assert(frame.contentWindow.eval("isValidMetaProgress(metaProgress)"),
          "the migrated housing state remains valid in the full game save");
        assert(frame.contentWindow.getCloudSaveSnapshot().meta.housing.houses.length === 2,
          "housing is included in the existing cloud snapshot");
        frame.contentWindow.eval("metaProgress.tavern.injuries = 1; persistMetaProgress(); openHousing();");
        frame.contentDocument.querySelector('[data-housing-action="sleep"]').click();
        saved = JSON.parse(frame.contentWindow.localStorage.getItem("well-of-whispers-camp-progress"));
        assert(saved.housing.sleep && saved.housing.sleep.endsAt - saved.housing.sleep.startedAt === 140 * 60000,
          "the home UI starts the best owned house's exact offline sleep timer");
        frame.contentWindow.eval("openHarbor()");
        assert(frame.contentDocument.querySelector("#housing-dialog").open &&
          !frame.contentDocument.querySelector("#harbor-dialog").open &&
          frame.contentDocument.querySelector("#housing-status").textContent.toLocaleLowerCase().includes("нельзя покидать"),
        "the harbor remains inaccessible while sleep is in progress");
        frame.remove();
        output.textContent += "PASS city UI purchases, unlock, quality selection, plot cap, source, confirmations, reload, and sleep\n";
      }

      Promise.resolve().then(browserUi).catch((error) => failures.push(`browser UI: ${error.message}`))
        .finally(() => {
          if (failures.length) {
            output.textContent += `${failures.length} FAILURE(S)\n${failures.join("\n")}\n`;
            document.getElementById("result").textContent = "FAIL";
            document.body.dataset.result = "fail";
          } else {
            document.getElementById("result").textContent = "PASS";
            document.body.dataset.result = "pass";
          }
        });
    </script>
  </body>
</html>
