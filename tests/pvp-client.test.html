<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>PvP client</title>
<h1 id="result">RUNNING</h1>
<pre id="log"></pre>
<script>
"use strict";
(async () => {
  const assert = (value, message) => { if (!value) throw new Error(message); };
  const log = (text) => { document.getElementById("log").textContent += `PASS ${text}\n`; };
  localStorage.clear();
  const frame = document.createElement("iframe");
  frame.src = "../index.html?pvp-client-test=1";
  document.body.append(frame);
  await new Promise((resolve) => frame.addEventListener("load", resolve, { once: true }));
  const app = frame.contentWindow;
  const doc = app.document;
  app.WellPvp.initialize({
    getFighter: app.getDungeonFighter,
    getBattleId: () => app.eval("state.liveDuelId"),
    canDuel: app.canRequestDungeonDuel,
    inDungeon: () => app.eval("state.started && !state.gameOver"),
    onBattle: app.applyPvpBattle,
    onGhost: app.startGhostDuel,
  });
  app.startGameWithClass("knight");
  const own = "11111111-1111-4111-8111-111111111111";
  const other = "22222222-2222-4222-8222-222222222222";
  const id = "33333333-3333-4333-8333-333333333333";
  let live = null;
  const requests = [];
  let loseResponse = true;
  let cachedAction = null;
  app.WellPlayerGroups.getPvpContext = () => ({ userId: own, groupId: id, active: true, members: [] });
  app.WellCloudSave.groupRpc = async (rpc, args) => {
    requests.push({ rpc, args: JSON.parse(JSON.stringify(args)) });
    if (rpc === "pvp_find") return null;
    if (rpc === "pvp_start") {
      const p = args.p_player;
      live = {
        id, status: "active", current_user_id: own, turn: 1,
        deadline_at: new Date(Date.now() + 40000).toISOString(),
        players: [{ ...p, user_id: own, nickname: "Тест", shield_cooldown: 0, torch_cooldown: 0, staff_cooldown: 0 },
          { ...p, user_id: other, nickname: "Напарник", shield_cooldown: 0, torch_cooldown: 0, staff_cooldown: 0 }],
        log: [],
      };
      return JSON.parse(JSON.stringify(live));
    }
    if (rpc === "pvp_action") {
      if (cachedAction) {
        assert(cachedAction.request === args.p_request_id, "retry changed UUID");
        return JSON.parse(JSON.stringify(cachedAction.result));
      }
      assert(args.p_expected_turn === 1 && args.p_action === "attack", "client action payload");
      live.turn = 2;
      live.current_user_id = other;
      live.players[1].hp -= 5;
      cachedAction = { request: args.p_request_id, result: JSON.parse(JSON.stringify(live)) };
      if (loseResponse) { loseResponse = false; throw new Error("Connection lost after commit"); }
      return JSON.parse(JSON.stringify(live));
    }
    if (rpc === "pvp_get") return JSON.parse(JSON.stringify(live));
    if (rpc === "pvp_leave") {
      live.status = "finished";
      live.winner_id = other;
      live.reason = "surrender";
      return JSON.parse(JSON.stringify(live));
    }
    throw new Error("Unknown mock RPC");
  };
  await app.WellPvp.refresh();
  const before = app.getCloudSaveSnapshot();
  await app.WellPvp.start(false);
  assert(requests.some((entry) => entry.rpc === "pvp_start" && entry.args.p_request_id &&
    entry.args.p_player.hp > 0 &&
    entry.args.p_player.agility === app.getDungeonFighter().agility &&
    !Object.hasOwn(app.getCloudSaveSnapshot().run.state, "agilityBonus")),
  "start snapshot/request missing or introduced a temporary Agility stat");
  assert(app.getCloudSaveSnapshot().run.state.liveDuelId === id, "active duel not persisted");
  assert(doc.getElementById("explore-button").hidden, "dungeon not locked");
  log("real-duel RPC snapshot, request UUID and persisted dungeon lock");
  doc.querySelector('[data-pvp-action="attack"]').click();
  await new Promise((resolve) => setTimeout(resolve, 1));
  assert(!doc.getElementById("pvp-retry-button").hidden, "network retry unavailable");
  assert(JSON.parse(localStorage.getItem(`well-of-whispers-pvp:${own}`)).args.p_expected_turn === 1, "pending turn not persisted");
  doc.getElementById("pvp-retry-button").click();
  await new Promise((resolve) => setTimeout(resolve, 1));
  assert(localStorage.getItem(`well-of-whispers-pvp:${own}`) === "null", "accepted pending action not cleared");
  assert(requests.filter((entry) => entry.rpc === "pvp_action").length === 2, "retry not sent");
  assert(doc.querySelector('[data-pvp-action="attack"]').disabled, "opponent turn lets us act");
  log("lost committed reply reuses UUID without duplicate action and enforces turn UI");
  live.players[0].shield_cooldown = 2;
  await app.WellPvp.refresh();
  assert(app.getCloudSaveSnapshot().run.state.combatProgress.cooldowns.shield === 2, "server cooldown keys not mapped");
  log("server scalar cooldown fields map to saved fighter state");
  const after = app.getCloudSaveSnapshot();
  assert(after.run.state.gold === before.run.state.gold && after.meta.essence === before.meta.essence &&
    after.meta.orderReputation === before.meta.orderReputation, "PvP minted rewards");
  doc.getElementById("pvp-leave-button").click();
  await new Promise((resolve) => setTimeout(resolve, 1));
  assert(!app.getCloudSaveSnapshot().run, "surrender did not end run");
  assert(app.getCloudSaveSnapshot().meta.essence === before.meta.essence, "PvP defeat awarded shards");
  log("surrender persists defeat without currency rewards");
  document.getElementById("result").dataset.result = "pass";
  document.getElementById("result").textContent = "PASS";
})().catch((error) => {
  document.getElementById("result").dataset.result = "fail";
  document.getElementById("result").textContent = "FAIL";
  document.getElementById("log").textContent += error.stack;
});
</script>
