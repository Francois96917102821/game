<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Profile and settings browser tests</title>
<h1 id="result">RUNNING</h1>
<pre id="log"></pre>
<iframe id="game" title="Game under test" src="../index.html"></iframe>
<script>
"use strict";
(async () => {
  const log = document.getElementById("log");
  const failures = [];
  const frame = document.getElementById("game");
  function assert(condition, message) {
    if (!condition) throw new Error(message);
  }
  function check(name, work) {
    try { work(); log.textContent += `PASS ${name}\n`; }
    catch (error) { failures.push(`${name}: ${error.stack}`); }
  }
  async function checkAsync(name, work) {
    try { await work(); log.textContent += `PASS ${name}\n`; }
    catch (error) { failures.push(`${name}: ${error.stack}`); }
  }
  function app() { return frame.contentWindow; }
  function element(id) { return app().document.getElementById(id); }
  function changeEvent() {
    const EventConstructor = app().Event;
    return new EventConstructor("change", { bubbles: true });
  }
  function visibilityEvent() {
    const EventConstructor = app().Event;
    return new EventConstructor("visibilitychange");
  }
  const audioContexts = [];
  class FakeAudioParam {
    constructor() { this.value = 0; }
    setValueAtTime(value) { this.value = value; }
    linearRampToValueAtTime(value) { this.value = value; }
    exponentialRampToValueAtTime(value) { this.value = value; }
    setTargetAtTime(value) { this.value = value; }
    cancelScheduledValues() {}
  }
  class FakeAudioNode {
    connect(destination) { this.destination = destination; }
    disconnect() { this.disconnected = true; }
  }
  class FakeGain extends FakeAudioNode {
    constructor() { super(); this.gain = new FakeAudioParam(); }
  }
  class FakeOscillator extends FakeAudioNode {
    constructor(context) {
      super();
      this.context = context;
      this.frequency = new FakeAudioParam();
      this.listeners = [];
    }
    start() { this.context.oscillators.push(this); }
    stop(time) {
      this.stopTime = time;
      setTimeout(() => {
        this.stopped = true;
        for (const listener of this.listeners) listener();
        this.listeners = [];
      }, Math.max(0, ((time ?? this.context.currentTime) - this.context.currentTime) * 1000));
    }
    addEventListener(type, listener) {
      if (type === "ended") this.listeners.push(listener);
    }
  }
  class FakeAudioContext {
    constructor() {
      this.state = "suspended";
      this.currentTime = 0;
      this.destination = {};
      this.oscillators = [];
      this.resumeCalls = 0;
      audioContexts.push(this);
    }
    createGain() { return new FakeGain(); }
    createOscillator() { return new FakeOscillator(this); }
    resume() { this.resumeCalls += 1; this.state = "running"; return Promise.resolve(); }
    suspend() { this.state = "suspended"; return Promise.resolve(); }
  }
  function installFakeAudio() { app().AudioContext = FakeAudioContext; }
  function waitForFrameReload() {
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => reject(new Error("Game reload timed out.")), 10000);
      frame.addEventListener("load", () => {
        clearTimeout(timer);
        resolve();
      }, { once: true });
      app().location.reload();
    });
  }
  await new Promise((resolve, reject) => {
    if (frame.contentDocument?.getElementById("settings-open-button")) {
      resolve();
      return;
    }
    const timer = setTimeout(() => reject(new Error("Game page load timed out.")), 10000);
    frame.addEventListener("load", () => {
      clearTimeout(timer);
      resolve();
    }, { once: true });
    frame.addEventListener("error", reject, { once: true });
  });

  check("settings entry is labeled and sound stays opt-in", () => {
    assert(element("settings-open-button").getAttribute("aria-haspopup") === "dialog", "settings entry opens a dialog");
    assert(element("sound-toggle").getAttribute("aria-pressed") === "false", "sound starts disabled");
    assert(app().getComputedStyle(element("sound-toggle").querySelector(".sound-icon-wave")).display === "none",
      "disabled sound icon hides its waves");
    assert(app().getComputedStyle(element("sound-toggle").querySelector(".sound-icon-muted")).display !== "none",
      "disabled sound icon shows its mute mark");
    assert(element("settings-sound").checked === false, "sound setting starts disabled");
    element("settings-open-button").click();
    assert(element("settings-dialog").open, "settings dialog opens");
  });
  check("profile name is normalized and remains separate from class", () => {
    const input = element("profile-display-name");
    input.value = "  Ада   Лавлейс  ";
    element("profile-settings-form").requestSubmit();
    assert(element("player-name").textContent === "Ада Лавлейс", "name whitespace is normalized");
    assert(element("player-subtitle").textContent === "Последний из наземных", "profile editing does not select a class");
    assert(app().localStorage.getItem("well-of-whispers-profile-settings").includes('"displayName":"Ада Лавлейс"'),
      "profile name is persisted locally");
  });
  const motion = element("settings-reduced-motion");
  element("profile-display-name").value = "Черновик имени";
  motion.checked = true;
  motion.dispatchEvent(changeEvent());
  const contrast = element("settings-high-contrast");
  contrast.checked = true;
  contrast.dispatchEvent(changeEvent());
  await new Promise((resolve) => app().requestAnimationFrame(resolve));
  check("display preferences apply and persist", () => {
    assert(app().document.body.dataset.reduceMotion === "true", "reduced motion applies");
    assert(app().document.body.dataset.highContrast === "true", "high contrast applies");
    assert(Number.parseFloat(app().getComputedStyle(element("health-bar")).transitionDuration) < 0.001,
      "reduced motion suppresses meter transitions");
    const mutedColor = app().getComputedStyle(app().document.body).getPropertyValue("--muted").trim();
    assert(mutedColor === "#c3c9b8", "high contrast palette is applied");
    assert(element("profile-display-name").value === "Черновик имени", "changing a setting preserves an unsaved name");
    assert(app().localStorage.getItem("well-of-whispers-profile-settings").includes('"reducedMotion":true'),
      "display preference is persisted");
  });
  await checkAsync("sound remains idle by default and starts a synthesized loop only after opt-in", async () => {
    installFakeAudio();
    await new Promise((resolve) => setTimeout(resolve, 0));
    assert(audioContexts.length === 0, "the disabled default creates no audio context");
    const sound = element("settings-sound");
    sound.checked = true;
    sound.dispatchEvent(changeEvent());
    await new Promise((resolve) => setTimeout(resolve, 0));
    assert(audioContexts.length === 1, "explicit opt-in creates one shared audio context");
    const context = audioContexts[0];
    const activeMusic = () => context.oscillators.filter((oscillator) =>
      oscillator.destination instanceof FakeGain
      && oscillator.destination.gain.value === 0.012
      && !oscillator.disconnected);
    assert(activeMusic().length === 3, "opt-in starts three quiet synthesized ambient voices");
    assert(context.state === "running", "audio starts only after the preference interaction");

    let hidden = false;
    Object.defineProperty(app().document, "hidden", { configurable: true, get: () => hidden });
    hidden = true;
    app().document.dispatchEvent(visibilityEvent());
    assert(context.state === "suspended", "hidden tabs suspend the shared audio context");
    assert(activeMusic().length === 0, "hidden tabs stop and dispose ambient voices");
    hidden = false;
    app().document.dispatchEvent(visibilityEvent());
    await new Promise((resolve) => setTimeout(resolve, 0));
    assert(context.state === "running", "returning to a visible tab resumes previously opted-in audio");
    assert(activeMusic().length === 3, "returning to the tab starts one fresh ambient loop");

    sound.checked = false;
    sound.dispatchEvent(changeEvent());
    await new Promise((resolve) => setTimeout(resolve, 800));
    assert(activeMusic().length === 0, "opting out fades and disposes every ambient voice");
    assert(element("sound-toggle").getAttribute("aria-pressed") === "false", "opt-out synchronizes the game control");
  });
  await checkAsync("sound preference persists without autoplay and both controls mute effects and music", async () => {
    installFakeAudio();
    const sound = element("settings-sound");
    sound.checked = true;
    sound.dispatchEvent(changeEvent());
    assert(element("sound-toggle").getAttribute("aria-pressed") === "true", "top-level control reflects sound");
    assert(app().getComputedStyle(element("sound-toggle").querySelector(".sound-icon-wave")).display !== "none",
      "enabled sound icon shows its waves");
    assert(app().getComputedStyle(element("sound-toggle").querySelector(".sound-icon-muted")).display === "none",
      "enabled sound icon hides its mute mark");
    assert(app().localStorage.getItem("well-of-whispers-sound-enabled") === "true", "sound opt-in is persisted");
    const contextCount = audioContexts.length;
    await waitForFrameReload();
    installFakeAudio();
    assert(element("settings-sound").checked, "enabled sound preference is restored after reload");
    assert(element("sound-toggle").getAttribute("aria-pressed") === "true", "restored preference synchronizes the game control");
    assert(audioContexts.length === contextCount, "a restored preference does not create or resume audio on load");
    app().document.dispatchEvent(visibilityEvent());
    await new Promise((resolve) => setTimeout(resolve, 0));
    assert(audioContexts.length === contextCount, "visibility alone cannot unlock audio after reload");
    element("sound-toggle").click();
    assert(element("settings-sound").checked === false, "existing sound button remains synchronized");
    assert(app().getComputedStyle(element("sound-toggle").querySelector(".sound-icon-wave")).display === "none",
      "button opt-out updates the sound icon");
    assert(app().localStorage.getItem("well-of-whispers-sound-enabled") === "false", "sound opt-out is persisted");
    element("settings-open-button").click();
  });

  frame.style.width = "360px";
  check("mobile settings remain reachable with touch-sized controls", () => {
    assert(app().matchMedia("(max-width: 700px)").matches, "game uses its mobile layout");
    assert(element("settings-open-button").getBoundingClientRect().height >= 44, "settings entry is touch-sized");
    for (const id of ["settings-sound", "settings-reduced-motion", "settings-high-contrast"]) {
      const label = element(id).closest("label");
      assert(label.getBoundingClientRect().height >= 44, `${id} has a touch-sized label`);
    }
  });

  await waitForFrameReload();
  check("profile, display and sound choices survive reload", () => {
    assert(element("player-name").textContent === "Ада Лавлейс", "profile name restored");
    assert(app().document.body.dataset.reduceMotion === "true", "reduced motion restored");
    assert(app().document.body.dataset.highContrast === "true", "contrast restored");
    assert(element("sound-toggle").getAttribute("aria-pressed") === "false", "sound remains opt-out");
  });

  document.getElementById("result").dataset.result = failures.length ? "fail" : "pass";
  document.getElementById("result").textContent = failures.length ? "FAIL" : "PASS";
  if (failures.length) log.textContent += failures.join("\n");
})().catch((error) => {
  document.getElementById("result").dataset.result = "fail";
  document.getElementById("result").textContent = "FAIL";
  document.getElementById("log").textContent += `${error.stack}\n`;
});
</script>
